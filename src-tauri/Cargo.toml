[package]
name = "wall"
version = "0.1.0"
edition = "2021"
description = "Wall, as a desktop app that is a download rather than a browser."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# http is here because the webview is a real browser origin, so the model call travels through
# Rust to avoid preflight. It carries the request, not the request shapes: those stay in
# shared/providers.mjs, which is the one place a wire format is written down.
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
# the operating system already has a place for secrets that is encrypted at rest and gated by
# the login session. A file in the app's own directory is neither.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
