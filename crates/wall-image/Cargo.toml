[package]
name = "wall-image"
version = "0.1.0"
edition = "2021"
description = "Decode, resize and re-encode a generated image, so a shipped page stops carrying a megabyte of it."

[lib]
crate-type = ["cdylib", "rlib"]

# Only the two formats that actually arrive. Gemini answers PNG, and the pipeline answers JPEG,
# because every byte of a format we cannot receive is a byte in everyone's download.
[dependencies.image]
version = "0.25"
default-features = false
features = ["png", "jpeg"]

# Size over speed: this runs once per generated image, where a few milliseconds either way is
# invisible, and the wasm ships inside the app where every kilobyte is not.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
